name: Playwright Tests & Allure Report

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CYBERSOFT_TOKEN: ${{ secrets.CYBERSOFT_TOKEN }}
          DOTENVX_QUIET: true
          DOTENV_CONFIG_SILENT: true
      run: npx playwright test || true

    - name: Install Allure CLI globally
      run: npm install -g allure-commandline --save-dev

    - name: Generate Allure Report
      run: |
        allure generate allure-results --clean -o allure-report

    # 1. Cấu hình upload artifact cho GitHub Pages
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report

    # 2. Deploy chính thức bằng action chuẩn của GitHub (giúp hiện mục Deployments ở trang chính)
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4