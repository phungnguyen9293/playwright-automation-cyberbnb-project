name: Playwright Tests & Allure Report

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CYBERSOFT_TOKEN: ${{ secrets.CYBERSOFT_TOKEN }}
          DOTENVX_QUIET: true
          DOTENV_CONFIG_SILENT: true
      run: npx playwright test

    - name: Install Allure CLI globally
      run: npm install -g allure-commandline --save-dev

    # 1. Tải lịch sử cũ một cách an toàn (Kiểm tra nếu nhánh gh-pages tồn tại mới checkout)
    - name: Get Allure history
      if: always()
      continue-on-error: true
      run: |
        git fetch origin gh-pages && git checkout origin/gh-pages -- history/ || echo "No previous history found, skipping..."

    # 2. Tạo thư mục allure-report từ allure-results
    - name: Generate Allure Report
      if: always()
      run: |
        if [ -d "history" ]; then
          mkdir -p allure-results/history
          cp -r history/* allure-results/history/
        fi
        allure generate allure-results --clean -o allure-report

    # 3. Push báo cáo lên nhánh gh-pages
    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-report
        keep_files: false
        commit_message: "Update Allure Report automatically"